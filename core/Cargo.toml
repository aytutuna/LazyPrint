[workspace]
resolver = "3"
members = ["lazy-ipp", "lazy-raster"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
# uniffi-bindgen-cs 0.12.0 generates for exactly this release; the pin holds Swift and Kotlin back with it.
uniffi = "=0.32.0"

[profile.release]
# Every cdylib and staticlib has to unwind: UniFFI turns a panic into an exception only if it can catch it.
panic = "unwind"
lto = true
codegen-units = 1
# UniFFI reads its metadata from the symbols of the built library, so they stay.
strip = "debuginfo"

[workspace]
resolver = "3"
members = ["lazyprint-jobs", "lazyprint-layout", "lazyprint-paper", "lazyprint-settings", "testdata-check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

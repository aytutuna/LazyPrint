name: Rust vectors

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - core/testdata/**
      - windows/LazyPrint.Core/**
      - windows/tools/vectorgen/**
      - .github/workflows/rust-vectors.yml
  pull_request:
    branches: [main]
    paths:
      - core/testdata/**
      - windows/LazyPrint.Core/**
      - windows/tools/vectorgen/**
      - .github/workflows/rust-vectors.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - name: Regenerate the vectors from the C# code
        shell: bash
        run: |
          out="$RUNNER_TEMP/vectors"
          dotnet run --project windows/tools/vectorgen -c Release -- "$out" "$GITHUB_WORKSPACE"
          cp core/testdata/SHA256SUMS "$out/SHA256SUMS"
          cd "$out"
          sha256sum --check --strict SHA256SUMS

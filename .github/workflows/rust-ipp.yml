name: rust-ipp

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - core/**
      - testdata/ipp/**
      - Tests/Fixtures/Ipp/**
      - .github/workflows/rust-ipp.yml
  pull_request:
    paths:
      - core/**
      - testdata/ipp/**
      - Tests/Fixtures/Ipp/**
      - .github/workflows/rust-ipp.yml
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ: 0.13.2
  CARGO_DENY: 0.22.1
  FUZZ_TOOLCHAIN: nightly-2026-11-20

defaults:
  run:
    working-directory: core

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
          shared-key: ipp-check
      - name: Test data is the copy of the fixtures
        shell: bash
        run: |
          cd ../testdata/ipp
          sha256sum --check --strict SHA256SUMS
          test "$(find . -type f ! -name SHA256SUMS | wc -l)" = "$(wc -l < SHA256SUMS)"
          while read -r _ file; do cmp "${file#\*}" "../../Tests/Fixtures/Ipp/${file#\*}"; done < SHA256SUMS
          # tls-printer-a.p12 is the Swift tests' own TLS identity; the Rust tests do not read it.
          diff <(find . -type f ! -name SHA256SUMS | sort) \n            <(cd ../../Tests/Fixtures/Ipp && find . -type f ! -name tls-printer-a.p12 | sort)
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  test:
    needs: check
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
          shared-key: ipp-test
      - run: cargo test --locked --workspace

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
          shared-key: ipp-licenses
      - run: cargo install cargo-deny --version "$CARGO_DENY" --locked
      - run: cargo deny --locked check licenses bans sources
      - run: cargo deny --locked --manifest-path lazy-ipp/fuzz/Cargo.toml --config deny.toml check licenses bans sources

  fuzz:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [decode, http, certificate, txt]
    runs-on: ubuntu-latest
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 1800 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            core/lazy-ipp/fuzz
          shared-key: ipp-fuzz
      - run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - run: cargo install cargo-fuzz --version "$CARGO_FUZZ" --locked
      - name: Corpus from the captured printer answers, requests and certificates
        shell: bash
        run: |
          corpus="lazy-ipp/fuzz/corpus/${{ matrix.target }}"
          mkdir -p "$corpus"
          case "${{ matrix.target }}" in
            decode)
              cp ../testdata/ipp/printers/*.bin ../testdata/ipp/requests/*.bin "$corpus" ;;
            txt)
              cp ../testdata/ipp/txt-hp.txt "$corpus" ;;
            certificate)
              for pem in ../testdata/ipp/*.pem; do
                grep -v -- '-----' "$pem" | base64 -d > "$corpus/$(basename "$pem" .pem).der"
              done ;;
            http)
              printf 'HTTP/1.1 200 OK\r\nTransfer-Encoding: chunked\r\n\r\n4\r\nabcd\r\n0\r\n\r\n' > "$corpus/chunked"
              printf 'HTTP/1.1 100 Continue\r\n\r\nHTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nab' > "$corpus/interim"
              printf 'HTTP/1.1 503 Busy\r\nRetry-After: 3\r\n\r\n' > "$corpus/busy" ;;
          esac
      - name: Lock file is current
        run: cargo fetch --locked --manifest-path lazy-ipp/fuzz/Cargo.toml
      - name: Fuzz ${{ matrix.target }}
        working-directory: core/lazy-ipp
        run: cargo "+$FUZZ_TOOLCHAIN" fuzz run "${{ matrix.target }}" -- -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048
      - name: Crashing inputs
        if: failure()
        shell: bash
        run: |
          for file in lazy-ipp/fuzz/artifacts/*/*; do
            echo "== $file"
            base64 "$file" | head -c 8000
          done

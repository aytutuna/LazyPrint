name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Built first, so the tests do not share the runner's cores with the compiler.
      - name: Build
        run: dotnet build windows/LazyPrint.sln -c Release
      - name: Test
        run: dotnet test windows/LazyPrint.sln -c Release --no-build

  macos:
    # Package.swift declares swift-tools-version 6.0 (the Swift 5 language mode), macOS 14 and
    # iOS 18. Xcode 16.4 is selected explicitly, as in Lazy Scan, so a change of the image's default
    # Xcode cannot change the toolchain silently.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel

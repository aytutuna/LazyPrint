name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Built first, so the tests do not share the runner's cores with the compiler.
      - name: Build
        run: dotnet build windows/LazyPrint.sln -c Release
      - name: Test
        run: dotnet test windows/LazyPrint.sln -c Release --no-build
        env:
          # The phone link's certificate tests use a certificate store of their own; on the runner only.
          LAZYPRINT_CERT_STORE_TESTS: '1'

  macos:
    # Package.swift declares swift-tools-version 6.0 (the Swift 5 language mode), macOS 14 and
    # iOS 18. Xcode 16.4 is selected explicitly, as in Lazy Scan, so a change of the image's default
    # Xcode cannot change the toolchain silently.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
        env:
          LAZYPRINT_SHOTS: ${{ runner.temp }}/shots
      - name: Screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-screens
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
      - name: Build the app
        run: |
          bash scripts/make_app.sh
          plutil -lint "dist/Lazy Print.app/Contents/Info.plist"
          codesign --verify --deep "dist/Lazy Print.app"
          ditto -c -k --keepParent "dist/Lazy Print.app" "$RUNNER_TEMP/LazyPrint-mac.zip"
      - name: App
        uses: actions/upload-artifact@v7
        with:
          name: lazyprint-mac
          path: ${{ runner.temp }}/LazyPrint-mac.zip

  mac-store:
    # The sandboxed Mac App Store target (mac/project.yml), built on the image and Xcode macappstore.yml uploads with
    # (macos-26, Xcode 26.6), so a compiler or SDK break shows here and not at upload. Signed ad hoc, which still puts the
    # entitlements in the binary; the upload workflow signs it for real.
    needs: macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # Same pinned XcodeGen as the ios job.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Write the app's project
        run: xcodegen generate --spec mac/project.yml
      - name: Build the store target
        run: |
          set -o pipefail
          xcodebuild build \
            -project mac/LazyPrintMacApp.xcodeproj \
            -scheme LazyPrintMacApp \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath "$RUNNER_TEMP/mac-store" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
      - name: Check the bundle
        run: |
          app="$RUNNER_TEMP/mac-store/Build/Products/Release/Lazy Print.app"
          plutil -lint "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Resources/PrivacyInfo.xcprivacy"
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/entitlements.plist"
          cat "$RUNNER_TEMP/entitlements.plist"
          for key in app-sandbox network.client network.server print files.user-selected.read-write files.bookmarks.app-scope; do
            [ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.$key" "$RUNNER_TEMP/entitlements.plist")" = "true" ] \
              || { echo "Missing entitlement: $key"; exit 1; }
          done
          if /usr/libexec/PlistBuddy -c "Print :com.apple.security.get-task-allow" "$RUNNER_TEMP/entitlements.plist" >/dev/null 2>&1; then
            echo "get-task-allow is set"
            exit 1
          fi
          codesign -dv "$app" 2>&1 | grep -q "runtime"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist" | grep -qx "com.lazyprint.lazyprint"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$app/Contents/Info.plist" | grep -qx "Lazy Print"

  ios:
    # The shared Swift suite (LazyPrintTests, on the iPhone leg only) and the app's own tests on the iOS Simulator, once the
    # macOS job is green: one leg on an iPhone and one on an iPad, each with its own screenshots. The macos-26 image (arm64)
    # ships Xcode 26.0.1 through 26.6 with 26.6 as its default, and iOS Simulator runtimes 26.2, 26.4 and 26.5; select 26.6
    # explicitly so a change of the image's default Xcode cannot change the toolchain silently. Source:
    # actions/runner-images, images/macos/macos-26-arm64-Readme.md.
    needs: macos
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: ios
            device: iPhone 17 Pro Max
            suffix: ""
            package_tests: true
          - job: ios-ipad
            device: iPad Pro 13-inch
            suffix: -ipad
            package_tests: false
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Simulator runtimes
        run: xcrun simctl list runtimes
      - name: Schemes
        run: xcodebuild -list
      # The device of the leg (the iPhone 17 Pro Max, or an iPad Pro 13-inch of any chip) on the iOS 26.5 runtime when the
      # image has it, so ScreenshotTests' frames are the 6.9-inch and 13-inch sizes the App Store asks for; otherwise the
      # newest iOS runtime's device of that family (its 13-inch iPad Pro when it has one), so a change of the image's
      # simulators does not stop the job.
      - name: Pick the simulator
        id: simulator
        env:
          IOS_RUNTIME: '26.5'
          IOS_DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          wanted_runtime = tuple(int(part) for part in os.environ["IOS_RUNTIME"].split("."))
          wanted_device = os.environ["IOS_DEVICE"]
          family = wanted_device.split()[0]
          devices_found = []
          for runtime, entries in devices.items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-"))
              for entry in entries:
                  if entry.get("isAvailable", False) and entry["name"].startswith(family):
                      devices_found.append((version, entry["name"], entry["udid"]))
          if not devices_found:
              sys.exit("No available %s simulator on this image." % family)
          exact = [d for d in devices_found if d[0] == wanted_runtime and d[1].startswith(wanted_device)]
          newest = max(d[0] for d in devices_found)
          latest = sorted(d for d in devices_found if d[0] == newest)
          preferred = [d for d in latest if d[1].startswith(wanted_device)]
          chosen = sorted(exact)[-1] if exact else (preferred or latest)[0]
          print("Simulator: %s, iOS %s, %s" % (chosen[1], ".".join(str(n) for n in chosen[0]), chosen[2]), file=sys.stderr)
          print("udid=%s" % chosen[2])
          PY
      # Optimized (a debug build of the image and PDF code can take many times longer), with testability on for the
      # tests' @testable imports. The result bundle is kept for a failure.
      - name: Test on the iOS Simulator
        if: matrix.package_tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LazyPrint-Package \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO
      # XcodeGen (MIT) writes the iPhone and iPad app's Xcode project from ios/project.yml. It is downloaded here only, pinned to
      # one release and its SHA-256 (the release's xcodegen.zip, a universal macOS binary with its setting presets), and
      # never shipped; the project it writes is not checked in. Source:
      # github.com/yonaskolb/XcodeGen/releases/tag/2.46.0.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Write the app's project
        run: |
          xcodegen --version
          xcodegen generate --spec ios/project.yml
      # The app and its UI tests, built once for the simulator picked above (optimized, as the package's tests are;
      # unsigned, which the Simulator allows), then run without building again.
      - name: Build the app for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/LazyPrintiOS.xcodeproj \
            -scheme LazyPrintiOS \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/app-build" \
            CODE_SIGNING_ALLOWED=NO
      # The iPad leg has no package tests to warm its simulator, and the first launches on a cold one time out.
      - name: Boot the simulator
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      - name: Run the app's UI tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project ios/LazyPrintiOS.xcodeproj \
            -scheme LazyPrintiOS \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/app-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-app-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      # The screens ScreenshotTests keeps, renamed from the export's own file names to their attachment names
      # (02-print.png, ...) through the manifest the export writes.
      - name: Export the screenshots
        if: always()
        run: |
          out="$RUNNER_TEMP/ios-screenshots"
          mkdir -p "$out"
          if [ ! -d "$RUNNER_TEMP/ios-app-tests.xcresult" ]; then
            echo "No app test results to export"
            exit 0
          fi
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/ios-app-tests.xcresult" \
            --output-path "$out"
          if [ -f "$out/manifest.json" ]; then
            python3 - "$out" <<'EOF'
          import json, os, re, sys
          out = sys.argv[1]
          with open(os.path.join(out, "manifest.json")) as f:
              tests = json.load(f)
          for test in tests:
              for attachment in test.get("attachments", []):
                  src = os.path.join(out, attachment.get("exportedFileName", ""))
                  name = attachment.get("suggestedHumanReadableName", "")
                  # The suggested name ends in "_<index>_<UUID>" before the extension.
                  name = re.sub(r"(_\d+)?_[0-9A-Fa-f-]{36}(?=\.\w+$)", "", name)
                  if not name or not src.endswith(".png") or not os.path.isfile(src):
                      continue
                  if not name.endswith(".png"):
                      name += ".png"
                  dst = os.path.join(out, name)
                  if not os.path.exists(dst):
                      os.rename(src, dst)
          EOF
          fi
          ls "$out"
      - name: Screenshot sizes
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/ios-screenshots/*.png; do
            [ -f "$f" ] && echo "$(basename "$f") $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}')"
          done
          true
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots${{ matrix.suffix }}
          path: ${{ runner.temp }}/ios-screenshots
          if-no-files-found: warn
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-xcresult${{ matrix.suffix }}
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-app-tests.xcresult
          if-no-files-found: ignore

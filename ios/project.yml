# The iPhone app's Xcode project, for XcodeGen (CI pins its release and SHA-256; see the
# ios job in .github/workflows/ci.yml). `xcodegen generate --spec ios/project.yml` writes
# ios/LazyPrintiOS.xcodeproj, which is not checked in. The app target holds no logic: it starts
# LazyPrintIOSApp from the package at the repository root (Sources/LazyPrintIOS).
name: LazyPrintiOS

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  LazyPrint:
    path: ..

targets:
  LazyPrintiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LazyPrintiOS
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: LazyPrintiOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LazyPrint
        product: LazyPrintIOS
    settings:
      base:
        PRODUCT_NAME: LazyPrint
        PRODUCT_MODULE_NAME: LazyPrintiOS
        PRODUCT_BUNDLE_IDENTIFIER: com.lazyprint.lazyprint
        INFOPLIST_FILE: LazyPrintiOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only: iPads run it in iPhone compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LazyPrintiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LazyPrintiOSUITests
        excludes:
          - Fixtures
          - Fixtures/**
      # The document the flows print (drawn by scripts/make_ios_ui_fixture.py).
      - path: LazyPrintiOSUITests/Fixtures/report.pdf
        buildPhase: resources
    dependencies:
      - target: LazyPrintiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazyprint.lazyprint.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: LazyPrintiOS

schemes:
  LazyPrintiOS:
    build:
      targets:
        LazyPrintiOS: all
        LazyPrintiOSUITests: [test]
    test:
      targets:
        - LazyPrintiOSUITests
      gatherCoverageData: false
